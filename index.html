<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Analyzer</title>
<style>
  :root{
    --bg: #FFFFFF;
    --text: #111111;
    --text-dim: #555555;
    --rule: #DDDDDD;
    --serif: Georgia, 'Times New Roman', Times, serif;
  }
  * { box-sizing: border-box; }
  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
  }
  body{
    display:flex;
    justify-content:center;
    padding: 72px 24px;
  }
  .wrap{
    width:100%;
    max-width: 560px;
  }
  h1{
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 6px 0;
  }
  .sub{
    color: var(--text-dim);
    font-size: 16px;
    margin: 0 0 40px 0;
  }
  label{
    display:block;
    font-size: 15px;
    margin-bottom: 8px;
  }
  input[type="text"]{
    width:100%;
    font-family: var(--serif);
    font-size: 16px;
    padding: 10px 0;
    border: none;
    border-bottom: 1px solid var(--text);
    background: transparent;
    color: var(--text);
    outline: none;
  }
  input[type="text"]::placeholder{ color: #AAAAAA; }

  hr{
    border: none;
    border-top: 1px solid var(--rule);
    margin: 40px 0;
  }
  h2{
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 18px 0;
  }
  .row{
    display:flex;
    justify-content:space-between;
    padding: 8px 0;
    font-size: 16px;
  }
  .row .k{ color: var(--text-dim); }
  .row .v{ font-weight: 700; }
  .placeholder{
    color: var(--text-dim);
    font-size: 15px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Password Strength Analyzer</h1>
  <p class="sub">Enter a password to check its length, entropy, and overall score.</p>

  <label for="pw">Password</label>
  <input type="text" id="pw" placeholder="Type a password to check" autocomplete="off" spellcheck="false">

  <hr>

  <h2>Password Analysis</h2>
  <div id="results">
    <p class="placeholder">No password entered yet.</p>
  </div>
</div>

<script>
  const pwInput = document.getElementById('pw');
  const results = document.getElementById('results');

  function poolSize(pw){
    let size = 0;
    if (/[a-z]/.test(pw)) size += 26;
    if (/[A-Z]/.test(pw)) size += 26;
    if (/[0-9]/.test(pw)) size += 10;
    if (/[^a-zA-Z0-9]/.test(pw)) size += 32;
    return size || 1;
  }

  function verdictFor(score){
    if (score < 20) return 'Very Weak';
    if (score < 40) return 'Weak';
    if (score < 60) return 'Fair';
    if (score < 80) return 'Strong';
    return 'Very Strong';
  }

  function analyze(pw){
    if (pw.length === 0){
      results.innerHTML = '<p class="placeholder">No password entered yet.</p>';
      return;
    }

    const entropy = pw.length * Math.log2(poolSize(pw));
    const score = Math.min(100, Math.round(entropy));
    const verdict = verdictFor(score);

    results.innerHTML = `
      <div class="row"><span class="k">Length</span><span class="v">${pw.length}</span></div>
      <div class="row"><span class="k">Entropy</span><span class="v">${entropy.toFixed(2)} bits</span></div>
      <div class="row"><span class="k">Score</span><span class="v">${score} / 100</span></div>
      <div class="row"><span class="k">Verdict</span><span class="v">${verdict}</span></div>
    `;
  }

  pwInput.addEventListener('input', (e) => analyze(e.target.value));
  analyze('');
</script>
</body>
</html>
